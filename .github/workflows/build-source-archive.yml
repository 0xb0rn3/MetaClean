name: Validate source and rebuild archive

on:
  push:
    branches: [main]
    paths:
      - "metaclean/**"
      - "install.sh"
      - "install-linux.sh"
      - "install.ps1"
      - ".github/workflows/build-source-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r metaclean/requirements.txt
      - name: Validate Python, shell, PowerShell and application tests
        run: |
          python -m py_compile metaclean/app.py
          bash -n metaclean/setup.sh
          bash -n metaclean/run.sh
          bash -n install.sh
          bash -n install-linux.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoLogo -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          fi
          cd metaclean
          python -m unittest discover -s tests -v
      - name: Rebuild source archive
        run: tar -cJf MetaClean-Termux.tar.xz metaclean
      - name: Commit refreshed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MetaClean-Termux.tar.xz
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Termux source archive"
            git push
          fi
