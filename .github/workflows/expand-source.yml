name: Verify and expand MetaClean source

on:
  push:
    branches: [main]
    paths:
      - .github/archive-parts/part-*.b64
      - .github/workflows/expand-source.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/archive-parts/part-*.b64 | base64 --decode > MetaClean-Termux.tar.xz
          echo "e00d34258862eebc63db4220bc9722f65702f0321f5308662ddaf0705de1a761  MetaClean-Termux.tar.xz" | sha256sum --check -
      - name: Expand source
        run: tar -xJf MetaClean-Termux.tar.xz
      - name: Commit source tree and archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/archive-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A MetaClean-Termux.tar.xz metaclean .github/archive-parts
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish verified MetaClean source"
            git push
          fi
